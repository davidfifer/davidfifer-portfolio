version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notesapi-api
    env_file:
      - .env.docker
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: notesapi-db
    environment:
      POSTGRES_USER: notes_api_user
      POSTGRES_PASSWORD: springbootuser
      POSTGRES_DB: notes_api_db
    ports:
      - "5432:5432"
    volumes:
      - notesapi-db-data:/var/lib/postgresql/data

volumes:
  notesapi-db-data:
